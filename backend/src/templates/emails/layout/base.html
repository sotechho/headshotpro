<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.6;
        color: #cbd0dc;
        margin: 0;
        padding: 0;
        background-color: #0b0b12;
      }
      .email-wrapper {
        max-width: 600px;
        margin: 0 auto;
        background-color: #131320;
        border: 1px solid #21212f;
        border-radius: 16px;
        overflow: hidden;
      }
      .email-header {
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        padding: 28px 20px;
        text-align: center;
      }
      .email-header h1 {
        color: #ffffff;
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .email-body {
        padding: 40px;
      }
      .email-body h2 {
        color: #f5f3ff;
        font-size: 18px;
        font-weight: 600;
        margin: 28px 0 12px 0;
        letter-spacing: -0.01em;
      }
      .email-body h2:first-child {
        margin-top: 0;
      }
      .email-body p {
        margin: 0 0 16px 0;
        font-size: 15px;
        color: #cbd0dc;
      }
      .button {
        display: inline-block;
        padding: 13px 28px;
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 10px;
        margin: 20px 0;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.01em;
      }
      .button:hover {
        background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      }
      .text-muted {
        color: #7c8194;
        font-size: 13px;
      }
      .email-footer {
        background-color: #0f0f19;
        padding: 24px 20px;
        text-align: center;
        border-top: 1px solid #21212f;
      }
      .email-footer p {
        margin: 4px 0;
        font-size: 12px;
        color: #7c8194;
      }
      .link-url {
        word-break: break-all;
        color: #a78bfa;
        font-size: 12px;
        text-decoration: underline;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0b0b12">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #0b0b12"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <div class="email-wrapper">
            <div class="email-header">
              <h1>Headshot Generator</h1>
            </div>
            <div class="email-body">{{content}}</div>
            <div class="email-footer">
              <p>Best regards,<br />The Headshot Generator Team</p>
              <p class="text-muted">
                This is an automated email, please do not reply.
              </p>
            </div>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
